paths:
  /api/auth/register:
    post:
      tags:
        - Auth
      summary: Daftar akun baru
      description: Mendaftarkan user baru sebagai CUSTOMER. Mengembalikan JWT token yang langsung bisa digunakan.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  minLength: 2
                  example: Budi Santoso
                  description: Nama lengkap (min 2 karakter)
                email:
                  type: string
                  format: email
                  example: budi@gmail.com
                password:
                  type: string
                  minLength: 6
                  example: "rahasia123"
                  description: Password (min 6 karakter)
      responses:
        '201':
          description: Akun berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                success: true
                data:
                  user:
                    id: clx1234abcd
                    name: Budi Santoso
                    email: budi@gmail.com
                    role: CUSTOMER
                    createdAt: "2024-07-07T07:00:00.000Z"
                  token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        '400':
          description: Validasi gagal atau email sudah terdaftar
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/ErrorResponse'
              examples:
                emailTaken:
                  summary: Email sudah terdaftar
                  value:
                    success: false
                    message: Email sudah terdaftar
                validationError:
                  summary: Validasi gagal
                  value:
                    success: false
                    errors:
                      email: ["Format email tidak valid"]
                      password: ["Password minimal 6 karakter"]

  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Login ke akun
      description: |
        Login dengan email dan password. Mengembalikan JWT token untuk autentikasi.

        **Demo accounts:**
        - Customer: `user@gromar.id` / `customer123`
        - Admin: `admin@gromar.id` / `admin123`
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@gromar.id
                password:
                  type: string
                  example: "customer123"
            examples:
              customerLogin:
                summary: Login sebagai Customer
                value:
                  email: user@gromar.id
                  password: customer123
              adminLogin:
                summary: Login sebagai Admin
                value:
                  email: admin@gromar.id
                  password: admin123
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Email atau password salah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Email atau password salah

  /api/auth/me:
    get:
      tags:
        - Auth
      summary: Info user yang sedang login
      description: Mendapatkan detail user berdasarkan JWT token yang dikirimkan.
      operationId: getMe
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Data user berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          description: Token tidak valid atau tidak ada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Token tidak ditemukan
